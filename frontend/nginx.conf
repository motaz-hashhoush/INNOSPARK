# HTTP-only — SSL termination is handled by global_nginx upstream.
# X-Forwarded-Proto is set by global_nginx, so the app sees "https".
server {
    listen 80;
    server_name innohub.najah.ai;

    root /usr/share/nginx/html;
    index index.html;

    # Angular routing — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend
    location /api/ {
        client_max_body_size 200m;  # booth video uploads
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Proxy uploads
    # ^~ so the static-asset regex below cannot capture /uploads/*.jpg
    location ^~ /uploads/ {
        proxy_pass http://backend:8000;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
