services:
  backend:
    container_name: innospark
    build: ./backend
    restart: always
    ports:
      - "4000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@host.docker.internal:5432/${POSTGRES_DB:-innospark}
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-secure-random-string}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      UPLOAD_DIR: /app/uploads
      AI_MODEL_NAME: ${AI_MODEL_NAME:-all-MiniLM-L6-v2}
    volumes:
      - uploads_data:/app/uploads

  frontend:
    container_name: innospark-frontend
    build: ./frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend

volumes:
  uploads_data:
